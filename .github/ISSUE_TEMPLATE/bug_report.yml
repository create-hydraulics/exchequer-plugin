name: Bug Report
description: Report something broken in Exchequer
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please only use this
        form for actual bugs, for setup help or general questions, use
        the Wiki or the resource page's comment/ticket system instead.
        Fill this out as completely as you can; missing info (especially
        Towny/Vault status and console errors) is the #1 reason bug
        reports take longer to fix.

  - type: input
    id: plugin-version
    attributes:
      label: Exchequer Version
      description: Found in /plugins or the plugin.yml, e.g. 1.2.0
      placeholder: "1.2.0"
    validations:
      required: true

  - type: dropdown
    id: server-software
    attributes:
      label: Server Software
      options:
        - Paper
        - Purpur
        - Folia
        - Other / Not sure
    validations:
      required: true

  - type: input
    id: mc-version
    attributes:
      label: Minecraft Version
      placeholder: "1.21.1"
    validations:
      required: true

  - type: dropdown
    id: towny-installed
    attributes:
      label: Is Towny installed?
      description: Exchequer behaves differently with vs without Towny,
        this matters a lot for diagnosing treasury/GDP/governance bugs.
      options:
        - "Yes"
        - "No"
        - Not sure
    validations:
      required: true

  - type: input
    id: towny-version
    attributes:
      label: Towny Version (if installed)
      description: Leave blank if Towny isn't installed
      placeholder: "0.102.0.0"
    validations:
      required: false

  - type: dropdown
    id: vault-installed
    attributes:
      label: Is Vault installed?
      description: Affects the Economy API bridge and whether MONEY is
        tradeable as a currency.
      options:
        - "Yes"
        - "No"
        - Not sure
    validations:
      required: true

  - type: dropdown
    id: bug-area
    attributes:
      label: Which part of the plugin is affected?
      description: Pick the closest match, helps route this to the right
        part of the codebase faster.
      multiple: true
      options:
        - Bank GUI (deposit/withdraw)
        - Exchange GUI / /exchange command
        - Market GUI / price & history commands
        - GDP / Dutch Disease / industry specialization
        - Trade routes
        - Town shares
        - War/raid insurance
        - Economic events
        - Towny integration (treasury, governance, taxation)
        - Vault / MONEY currency
        - Cross-server sync
        - PlaceholderAPI placeholders
        - Something else / not sure
    validations:
      required: true

  - type: textarea
    id: reproduction-steps
    attributes:
      label: Steps to Reproduce
      description: Exact steps, in order. Include command syntax if
        relevant, e.g. `/exchange iron gold 500`.
      placeholder: |
        1. Open the Exchange GUI via /exchequer exchange
        2. Select iron as "from" and gold as "to"
        3. Enter an amount greater than my current balance
        4. Click confirm
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected Behavior
    validations:
      required: true

  - type: textarea
    id: actual-behavior
    attributes:
      label: Actual Behavior
    validations:
      required: true

  - type: textarea
    id: console-log
    attributes:
      label: Console Error / Stack Trace
      description: Paste any relevant console output. This gets
        auto-formatted as code, no need to add backticks yourself.
      render: shell
    validations:
      required: false

  - type: textarea
    id: config-snippet
    attributes:
      label: Relevant config.yml Section
      description: If the bug involves tax rates, material settings, or
        anything else config-driven, paste the relevant section here.
      render: yaml
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I've checked the Wiki and this isn't a known/documented behavior
          required: true
        - label: I'm running the latest version of Exchequer
          required: true
        - label: I've included console errors if any appeared
          required: false
